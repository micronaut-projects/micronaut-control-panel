infinispan.enabled = true
hazelcast.enabled = false

#test-resources.containers.infinispan.image-name=infinispan/server
#test-resources.containers.infinispan.exposed-ports[0].infinispan.port=11222
#test-resources.containers.infinispan.hostnames[0]=infinispan.host
#test-resources.containers.infinispan.env[0].USER=user
#test-resources.containers.infinispan.env[0].PASS=pass

infinispan.host=localhost
infinispan.port=11222
infinispan.user=admin
infinispan.password=admin

infinispan.client.hotrod.force-return-values=true
infinispan.client.hotrod.server.host=${infinispan.host}
infinispan.client.hotrod.server.port=${infinispan.port}
infinispan.client.hotrod.security.authentication.username=${infinispan.user}
infinispan.client.hotrod.security.authentication.password=${infinispan.password}
infinispan.client.hotrod.security.authentication.realm=default
infinispan.client.hotrod.security.authentication.server-name=infinispan
infinispan.client.hotrod.security.authentication.sasl-mechanism=DIGEST-MD5
