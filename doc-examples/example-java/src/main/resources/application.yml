#tag::control-panel[]
micronaut:
  control-panel:
    panels:
      my-application:
        title: My Application Control Panel # <1>
        icon: fa-plug # <2>
        order: 10 # <3>
#end::control-panel[]
    env:
      show-values: true
  object-storage:
    local:
      my-local:
        path: /tmp/foo/
  caches:
    my-caffeine:
      initial-capacity: 2
  application:
    name: myApplication

ehcache:
  caches:
    my-ehcache:
      enabled: true

infinispan:
  enabled: true
  client:
    hotrod:
      force-return-values: true
      security:
        authentication:
          username: admin
          password: admin
          realm: default
          sasl-mechanism: DIGEST-MD5
          server-name: infinispan
      server:
        host: ${infinispan.host}
        port: ${infinispan.port}

test-resources:
  containers:
    infinispan:
      image-name: infinispan/server
      wait-strategy:
        http:
          path: /rest/v2/cache-managers/default/health/status
      env:
        - USER: admin
          PASS: admin
      exposed-ports:
        - infinispan.port: 11222
      hostnames:
        - infinispan.host


# Test properties to verify environment endpoint filtering
test:
  username: john
  password: secret123
  api-key: abc123
  token: xyz789
  normal-config: some-value
netty:
  default:
    allocator:
      max-order: 3
endpoints:
  all:
    enabled: true
    sensitive: false
  health:
    details-visible: ANONYMOUS
  loggers:
    write-sensitive: false
