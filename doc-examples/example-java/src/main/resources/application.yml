#tag::control-panel[]
micronaut:
  control-panel:
    panels:
      my-application:
        title: My Application Control Panel # <1>
        icon: fa-plug # <2>
        order: 10 # <3>
#end::control-panel[]
    env:
      show-values: true
  object-storage:
    local:
      my-local:
        path: /tmp/foo/
  caches:
    my-caffeine:
      initial-capacity: 2
  application:
    name: myApplication

ehcache:
  caches:
    my-ehcache:
      enabled: true

datasources:
  my-oracle:
    db-type: oracle
    driver-class-name: oracle.jdbc.OracleDriver
  my-postgres:
    db-type: postgres
    driver-class-name: org.postgresql.Driver
#  my-h2:
#    url: jdbc:h2:mem:devDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
#    username: sa
#    password:
#    dialect: h2
#    driver-class-name: org.h2.Driver

# Test properties to verify environment endpoint filtering
test:
  username: john
  password: secret123
  api-key: abc123
  token: xyz789
  normal-config: some-value
netty:
  default:
    allocator:
      max-order: 3
endpoints:
  all:
    enabled: true
    sensitive: false
  health:
    details-visible: ANONYMOUS
  loggers:
    write-sensitive: false

infinispan:
  enabled: false
hazelcast:
  enabled: false
