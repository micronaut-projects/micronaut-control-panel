#tag::control-panel[]
micronaut:
  metrics:
    enabled: true
  control-panel:
    panels:
      my-application:
        title: My Application Control Panel # <1>
        icon: fa-plug # <2>
        order: 10 # <3>
#end::control-panel[]
    env:
      show-values: true
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  object-storage:
    local:
      my-local:
        path: /tmp/foo/
  caches:
    my-caffeine:
      initial-capacity: 2
  application:
    name: myApplication

datasources:
  flyway-demo:
    url: jdbc:h2:mem:flywayDemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

flyway:
  enabled: true
  datasources:
    flyway-demo:
      enabled: true
      locations:
        - classpath:db/flyway-demo

jpa:
  flyway-demo:
    enabled: false

ehcache:
  caches:
    my-ehcache:
      enabled: true

# Test properties to verify environment endpoint filtering
test:
  username: john
  password: secret123
  api-key: abc123
  token: xyz789
  normal-config: some-value
endpoints:
  all:
    enabled: true
    sensitive: false
  flyway:
    enabled: false
  health:
    details-visible: ANONYMOUS

infinispan:
  enabled: false
hazelcast:
  enabled: false
kafka:
  enabled: false
