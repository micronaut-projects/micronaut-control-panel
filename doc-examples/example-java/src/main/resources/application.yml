#tag::control-panel[]
micronaut:
  control-panel:
    env:
      show-values: true # <4>
    panels:
      my-application:
        title: My Application Control Panel # <1>
        icon: fa-plug # <2>
        order: 10 # <3>
#end::control-panel[]
      object-storage:
        enabled: true
  object-storage:
    local:
      mylocal:
        path: /tmp/foo/
    aws:
      myaws:
        bucket: alvaro-control-panel-demo
  application:
    name: myApplication

aws:
  region: eu-west-3

# Test properties to verify environment endpoint filtering
test:
  username: john
  password: secret123
  api-key: abc123
  token: xyz789
  normal-config: some-value
netty:
  default:
    allocator:
      max-order: 3
endpoints:
  all:
    enabled: true
    sensitive: false
  health:
    details-visible: ANONYMOUS
  loggers:
    write-sensitive: false
