#tag::control-panel[]
micronaut:
  control-panel:
    panels:
      my-application:
        title: My Application Control Panel # <1>
        icon: fa-plug # <2>
        order: 10 # <3>
      openapi:
        title: OpenAPI
        icon: fa-file-code
        enabled: true
        order: 100
#end::control-panel[]
    env:
      show-values: true
  object-storage:
    local:
      my-local:
        path: /tmp/foo/
  caches:
    my-caffeine:
      initial-capacity: 2
  application:
    name: myApplication
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
      redoc:
        paths: classpath:META-INF/swagger/views/redoc
        mapping: /redoc/**
      rapidoc:
        paths: classpath:META-INF/swagger/views/rapidoc
        mapping: /rapidoc/**
      scalar:
        paths: classpath:META-INF/swagger/views/scalar
        mapping: /scalar/**
      openapi-explorer:
        paths: classpath:META-INF/swagger/views/openapi-explorer
        mapping: /openapi-explorer/**

ehcache:
  caches:
    my-ehcache:
      enabled: true

datasources:
  my-oracle:
    db-type: oracle
    driver-class-name: oracle.jdbc.OracleDriver
  my-postgres:
    db-type: postgres
    driver-class-name: org.postgresql.Driver

# Test properties to verify environment endpoint filtering
test:
  username: john
  password: secret123
  api-key: abc123
  token: xyz789
  normal-config: some-value
netty:
  default:
    allocator:
      max-order: 3
endpoints:
  all:
    enabled: true
    sensitive: false
  health:
    details-visible: ANONYMOUS
  loggers:
    write-sensitive: false

infinispan:
  enabled: false
hazelcast:
  enabled: false
