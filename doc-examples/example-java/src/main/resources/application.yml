#tag::control-panel[]
micronaut:
  metrics:
    enabled: true
  control-panel:
    panels:
      my-application:
        title: My Application Control Panel # <1>
        icon: fa-plug # <2>
        order: 10 # <3>
#end::control-panel[]
    env:
      show-values: true
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  object-storage:
    local:
      my-local:
        path: /tmp/foo/
  caches:
    my-caffeine:
      initial-capacity: 2
  application:
    name: myApplication

jackson:
  xml:
    default-use-wrapper: false
    parser:
      auto-detect-xsi-type: true
    generator:
      write-xml-declaration: true

info:
  demo:
    name: Micronaut Control Panel Example
    environment:
      purpose: Local development
      owner: Micronaut

ehcache:
  caches:
    my-ehcache:
      enabled: true

# Test properties to verify environment endpoint filtering
test:
  username: john
  password: secret123
  api-key: abc123
  token: xyz789
  normal-config: some-value
endpoints:
  all:
    enabled: true
    sensitive: false
  health:
    details-visible: ANONYMOUS
  info:
    enabled: true

infinispan:
  enabled: false
hazelcast:
  enabled: false
kafka:
  enabled: false
