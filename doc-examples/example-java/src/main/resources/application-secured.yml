#tag::control-panel-authorized[]
micronaut:
  security:
    enabled: true
    basic-auth:
      enabled: true
  control-panel:
    enabled: true
    security:
      access: authorized
      role: ROLE_CONTROL_PANEL

endpoints:
  env:
    enabled: true
  health:
    details-visible: AUTHENTICATED
  loggers:
    enabled: true
    write-sensitive: false
#end::control-panel-authorized[]
