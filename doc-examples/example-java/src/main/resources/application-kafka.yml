kafka:
  enabled: true
  schema:
    registry:
      url: ${auto.test.resources.kafka.schema.registry.url}
  streams:
    default:
      schema.registry.url: ${kafka.schema.registry.url}
      session.timeout.ms: 10000
      internal.leave.group.on.close: true
      topology.optimization: "reuse.ktable.source.topics"
      default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      default.value.serde: io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde
      auto.offset.reset: earliest

micronaut:
  control-panel:
    kafka:
      integrations:
        connect:
          url: ${auto.test.resources.kafka.connect.url}
        ksqldb:
          url: ${auto.test.resources.kafka.ksqldb.url}
      writes:
        enabled: true
        destructive-enabled: true
