# https://github.com/micronaut-projects/micronaut-object-storage/issues/515
# Native-image configuration for example-java tests (GraalVM JDK 25)
# Build-time init for logging (SLF4J/Logback), Jackson core, Azure ClientLogger, JUnit platform logger,
# and Pulsar's no-auth singleton configuration used by the opt-in Pulsar example.
# Run-time init only for Netty's internal logging wrappers
Args = \
  --initialize-at-build-time=org.slf4j,ch.qos.logback.classic,ch.qos.logback.core,com.fasterxml.jackson.core,com.azure.core.util.logging,org.junit.platform.commons.logging,org.xml.sax.helpers,org.apache.pulsar.client.impl.auth.AuthenticationDataNull,org.apache.pulsar.client.impl.auth.AuthenticationDisabled \
  --initialize-at-run-time=io.netty.util.internal.logging \
  -H:+SharedArenaSupport
