# Defaults for OpenAPI panels and category
micronaut.control-panel.path=/control-panel

# Category is derived from panels, but we set titles/icons per panel.
# Users can override these in application.yml/properties.
micronaut.control-panel.panels.openapi-swagger-ui.title=Swagger UI
micronaut.control-panel.panels.openapi-swagger-ui.icon=fa-book-open
micronaut.control-panel.panels.openapi-swagger-ui.order=10

micronaut.control-panel.panels.openapi-redoc.title=Redoc
micronaut.control-panel.panels.openapi-redoc.icon=fa-book-open
micronaut.control-panel.panels.openapi-redoc.order=20

micronaut.control-panel.panels.openapi-openapi-explorer.title=OpenAPI Explorer
micronaut.control-panel.panels.openapi-openapi-explorer.icon=fa-book-open
micronaut.control-panel.panels.openapi-openapi-explorer.order=30

micronaut.control-panel.panels.openapi-scalar.title=Scalar
micronaut.control-panel.panels.openapi-scalar.icon=fa-book-open
micronaut.control-panel.panels.openapi-scalar.order=40

micronaut.control-panel.panels.openapi-rapidoc.title=RapiDoc
micronaut.control-panel.panels.openapi-rapidoc.icon=fa-book-open
micronaut.control-panel.panels.openapi-rapidoc.order=50
